{% extends "base.html" %}
{% block content %}
<h2>Doctors</h2>
<table>
  <tr><th>ID</th><th>Name</th><th>Specialization</th><th>Department</th><th>Phone</th><th>Salary</th></tr>
  {% for d in doctors %}
  <tr>
    <td>{{ d.doctor_id }}</td>
    <td>Dr. {{ d.first_name }} {{ d.last_name }}</td>
    <td>{{ d.specialization }}</td>
    <td>{{ d.dept_name }}</td>
    <td>{{ d.phone }}</td>
    <td>{{ d.salary }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
