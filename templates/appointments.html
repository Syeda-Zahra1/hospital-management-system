{% extends "base.html" %}
{% block content %}
<h2>Appointments</h2>
<form method="POST" action="/appointments/add" class="form-box">
  <input name="patient_id" placeholder="Patient ID" type="number" required>
  <input name="doctor_id" placeholder="Doctor ID" type="number" required>
  <input name="appointment_date" type="datetime-local" required>
  <input name="reason" placeholder="Reason">
  <button type="submit">Book</button>
</form>

<table>
  <tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Status</th><th>Reason</th></tr>
  {% for a in appointments %}
  <tr>
    <td>{{ a.appointment_id }}</td>
    <td>{{ a.patient_name }}</td>
    <td>{{ a.doctor_name }}</td>
    <td>{{ a.appointment_date }}</td>
    <td>{{ a.status }}</td>
    <td>{{ a.reason }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
