{% extends "base.html" %}
{% block content %}
<h2>Staff Directory</h2>

<form method="POST" action="/staff/add" class="form-box">
  <input name="first_name" placeholder="First Name" required>
  <input name="last_name" placeholder="Last Name" required>
  <input name="role" placeholder="Role (e.g., Nurse, Ward Boy)" required>
  <input name="phone" placeholder="Phone">
  <input name="email" placeholder="Email" type="email">
  <input name="dept_id" placeholder="Dept ID (1-5)" type="number">
  <input name="salary" placeholder="Salary" type="number" step="0.01">
  <button type="submit">➕ Add Employee</button>
</form>

<table>
  <tr><th>ID</th><th>Name</th><th>Role</th><th>Department</th><th>Phone</th><th>Salary</th></tr>
  {% for s in staff %}
  <tr>
    <td>{{ s.staff_id }}</td>
    <td>{{ s.first_name }} {{ s.last_name }}</td>
    <td>{{ s.role }}</td>
    <td>{{ s.dept_name }}</td>
    <td>{{ s.phone }}</td>
    <td>Rs. {{ s.salary }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
