{% extends "base.html" %}
{% block content %}
<h2>Inventory</h2>

<form method="POST" action="/medicines/add" class="form-box">
  <input name="medicine_name" placeholder="Medicine Name" required>
  <input name="manufacturer" placeholder="Manufacturer">
  <input name="price" type="number" step="0.01" placeholder="Price" required>
  <input name="expiry_date" type="date" required>
  <input name="quantity" type="number" placeholder="Quantity" value="0" required>
  <input name="reorder_level" type="number" placeholder="Reorder Level" value="10" required>
  <button type="submit">➕ Add Medicine</button>
</form>

<table>
  <tr>
    <th>ID</th>
    <th>Medicine</th>
    <th>Price</th>
    <th>Quantity</th>
    <th>Reorder Level</th>
    <th>Expiry</th>
    <th>Update</th>
  </tr>
  {% for i in inventory %}
  <tr class="{% if i.quantity < i.reorder_level %}low{% endif %}">
    <td>{{ i.inventory_id }}</td>
    <td>{{ i.medicine_name }}</td>
    <td>{{ i.price }}</td>
    <td>{{ i.quantity }}</td>
    <td>{{ i.reorder_level }}</td>
    <td>{{ i.expiry_date }}</td>
    <td>
      <form method="POST" action="/inventory/update/{{ i.inventory_id }}" style="display:inline">
        <input name="quantity" type="number" value="{{ i.quantity }}" style="width:70px">
        <button type="submit">Save</button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
